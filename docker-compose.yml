version: '3'
services:
  bd:
      image: mariadb:11.3.2
      restart: always
      env_file:
        - bd.env
      volumes:
        - ./data:/var/lib/mysql
  app:
    env_file:
      - app.env
    environment:
      PATH_PREFIX: sec
    build: ./app
    restart: always
    container_name: app
    volumes:
      - ./app/sistema_evaluacion_codigo:/code
    depends_on:
      - bd
  nginx:
    image: nginx
    restart: always
    volumes:
      - ./config/nginx/conf.d:/etc/nginx/conf.d
      - ./app/sistema_evaluacion_codigo/static_production:/static
      - ./app/sistema_evaluacion_codigo/media:/media
    depends_on:
      - app
    ports:
      - 8000:80
    environment:
      PATH_PREFIX: sec
  server:
    build:
      context: ./evaluador
    volumes:
      - ./evaluador:/app
    networks:
      - no-internet
networks:
  no-internet:
    internal: true
    driver: bridge
    ipam:
      config:
        - subnet: 10.1.1.0/24
